<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="720" viewBox="0 0 1200 720" font-family="'Hiragino Sans','Hiragino Kaku Gothic ProN','Noto Sans JP','Yu Gothic','Meiryo',sans-serif">
  <title>いまの避難訓練の課題と，ひなんクラフトVR での解決</title>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0b1730"/>
      <stop offset="1" stop-color="#0f2448"/>
    </linearGradient>
    <linearGradient id="right" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#123a6b"/>
      <stop offset="1" stop-color="#0e2c55"/>
    </linearGradient>
    <linearGradient id="fire" x1="0" y1="1" x2="0" y2="0">
      <stop offset="0" stop-color="#ff5a1f"/>
      <stop offset="1" stop-color="#ffc23d"/>
    </linearGradient>
    <marker id="head" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M0 0 L10 5 L0 10 z" fill="#ffb02e"/>
    </marker>
  </defs>

  <rect width="1200" height="720" fill="url(#bg)"/>

  <!-- 左: いまの避難訓練 -->
  <rect x="32" y="28" width="520" height="664" rx="20" fill="#1b2436" stroke="#46506a" stroke-width="2"/>
  <text x="292" y="84" text-anchor="middle" font-size="30" font-weight="700" fill="#c3cad8">いまの避難訓練</text>
  <line x1="64" y1="108" x2="520" y2="108" stroke="#46506a" stroke-width="2"/>

  <!-- 右: ひなんクラフトVR -->
  <rect x="648" y="28" width="520" height="664" rx="20" fill="url(#right)" stroke="#4fc3ff" stroke-width="3"/>
  <text x="908" y="84" text-anchor="middle" font-size="30" font-weight="700" fill="#ffffff">ひなんクラフト<tspan fill="#ffb02e">VR</tspan> なら</text>
  <line x1="680" y1="108" x2="1136" y2="108" stroke="#4fc3ff" stroke-opacity="0.5" stroke-width="2"/>

  <!-- 行 1 -->
  <g transform="translate(0,130)">
    <circle cx="104" cy="60" r="36" fill="#2a3449"/>
    <text x="104" y="74" text-anchor="middle" font-size="34" font-weight="700" fill="#9aa4b8" font-family="Arial,Helvetica,sans-serif">Zz</text>
    <text x="160" y="52" font-size="25" font-weight="700" fill="#e6e9f0">子どもは「めんどくさい」</text>
    <text x="160" y="86" font-size="18" fill="#9aa4b8">やらされる訓練は記憶に残らない</text>

    <line x1="562" y1="60" x2="632" y2="60" stroke="#ffb02e" stroke-width="6" marker-end="url(#head)"/>

    <circle cx="720" cy="60" r="36" fill="#0b2346" stroke="#4fc3ff" stroke-width="2"/>
    <rect x="694" y="46" width="52" height="28" rx="9" fill="#4fc3ff"/>
    <circle cx="708" cy="60" r="8" fill="#0b2346"/>
    <circle cx="732" cy="60" r="8" fill="#0b2346"/>
    <path d="M716 74 L720 66 L724 74 z" fill="#0b2346"/>
    <text x="776" y="52" font-size="25" font-weight="700" fill="#ffffff">VR で「やってみたい」</text>
    <text x="776" y="86" font-size="18" fill="#b9dcff">体験そのものが記憶に残る</text>
  </g>

  <!-- 行 2 -->
  <g transform="translate(0,270)">
    <circle cx="104" cy="60" r="36" fill="#2a3449"/>
    <path d="M104 46 L80 40 L80 76 L104 82 z" fill="none" stroke="#9aa4b8" stroke-width="4" stroke-linejoin="round"/>
    <path d="M104 46 L128 40 L128 76 L104 82 z" fill="none" stroke="#9aa4b8" stroke-width="4" stroke-linejoin="round"/>
    <text x="160" y="52" font-size="25" font-weight="700" fill="#e6e9f0">座学では実感がわかない</text>
    <text x="160" y="86" font-size="18" fill="#9aa4b8">煙の怖さ・低い姿勢を体で試せない</text>

    <line x1="562" y1="60" x2="632" y2="60" stroke="#ffb02e" stroke-width="6" marker-end="url(#head)"/>

    <circle cx="720" cy="60" r="36" fill="#0b2346" stroke="#4fc3ff" stroke-width="2"/>
    <path d="M692 40 Q699 33 706 40 T720 40 T734 40 T748 40" fill="none" stroke="#8fa3bf" stroke-width="4" stroke-linecap="round"/>
    <circle cx="714" cy="58" r="6" fill="#4fc3ff"/>
    <path d="M716 64 L728 70 L726 82 M728 70 L714 76 L708 84 M720 67 L734 66" fill="none" stroke="#4fc3ff" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="776" y="52" font-size="25" font-weight="700" fill="#ffffff">自分の学校の中を体で避難</text>
    <text x="776" y="86" font-size="18" fill="#b9dcff">足踏みで歩き，煙の中はしゃがむ</text>
  </g>

  <!-- 行 3 -->
  <g transform="translate(0,410)">
    <circle cx="104" cy="60" r="36" fill="#2a3449"/>
    <text x="104" y="74" text-anchor="middle" font-size="38" font-weight="700" fill="#9aa4b8" font-family="Arial,Helvetica,sans-serif">?</text>
    <text x="160" y="52" font-size="25" font-weight="700" fill="#e6e9f0">訓練はやりっぱなし</text>
    <text x="160" y="86" font-size="18" fill="#9aa4b8">何ができていなかったか分からない</text>

    <line x1="562" y1="60" x2="632" y2="60" stroke="#ffb02e" stroke-width="6" marker-end="url(#head)"/>

    <circle cx="720" cy="60" r="36" fill="#0b2346" stroke="#4fc3ff" stroke-width="2"/>
    <rect x="698" y="38" width="44" height="44" rx="4" fill="none" stroke="#4fc3ff" stroke-width="3"/>
    <path d="M704 76 L704 62 L720 62 L720 48 L736 48" fill="none" stroke="#4fc3ff" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
    <circle cx="704" cy="76" r="4" fill="#4fc3ff"/>
    <path d="M730 70 C734 64 738 66 736 72 C735 76 731 78 728 76 C726 74 727 72 730 70 z" fill="url(#fire)"/>
    <text x="776" y="52" font-size="25" font-weight="700" fill="#ffffff">結果画面で振り返り</text>
    <text x="776" y="86" font-size="18" fill="#b9dcff">通った経路・煙の中の姿勢・避難時間</text>
  </g>

  <!-- 行 4 -->
  <g transform="translate(0,550)">
    <circle cx="104" cy="60" r="36" fill="#2a3449"/>
    <text x="104" y="74" text-anchor="middle" font-size="38" font-weight="700" fill="#9aa4b8">¥</text>
    <text x="160" y="52" font-size="25" font-weight="700" fill="#e6e9f0">専用の VR 機器は高い</text>
    <text x="160" y="86" font-size="18" fill="#9aa4b8">クラスの人数分はそろえられない</text>

    <line x1="562" y1="60" x2="632" y2="60" stroke="#ffb02e" stroke-width="6" marker-end="url(#head)"/>

    <circle cx="720" cy="60" r="36" fill="#0b2346" stroke="#4fc3ff" stroke-width="2"/>
    <rect x="705" y="34" width="30" height="52" rx="6" fill="none" stroke="#4fc3ff" stroke-width="4"/>
    <circle cx="720" cy="78" r="3" fill="#4fc3ff"/>
    <text x="776" y="52" font-size="23" font-weight="700" fill="#ffffff">スマホ＋2,000 円ほどのゴーグル</text>
    <text x="776" y="86" font-size="18" fill="#b9dcff">専用機器もアプリのインストールも不要</text>
  </g>
</svg>
