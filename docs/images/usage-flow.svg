<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="624" viewBox="0 0 1200 624" font-family="'Hiragino Sans','Hiragino Kaku Gothic ProN','Noto Sans JP','Yu Gothic','Meiryo',sans-serif">
  <title>ひなんクラフトVR の使い方の流れ（先生が校舎を作る → 生徒が VR で避難する → 結果画面で振り返る）</title>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0b1730"/>
      <stop offset="1" stop-color="#0f2448"/>
    </linearGradient>
    <linearGradient id="panel" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#123a6b"/>
      <stop offset="1" stop-color="#0e2c55"/>
    </linearGradient>
    <linearGradient id="fire" x1="0" y1="1" x2="0" y2="0">
      <stop offset="0" stop-color="#ff5a1f"/>
      <stop offset="1" stop-color="#ffc23d"/>
    </linearGradient>
    <marker id="head" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M0 0 L10 5 L0 10 z" fill="#ffb02e"/>
    </marker>
  </defs>

  <rect width="1200" height="624" fill="url(#bg)"/>

  <!-- STEP 1: 先生が校舎を作る -->
  <g transform="translate(32,24)">
    <rect width="340" height="500" rx="20" fill="url(#panel)" stroke="#4fc3ff" stroke-width="2"/>
    <text x="170" y="40" text-anchor="middle" font-size="15" font-weight="700" fill="#ffb02e" letter-spacing="1">STEP 1 ・ 先生（PC）</text>
    <text x="170" y="78" text-anchor="middle" font-size="27" font-weight="700" fill="#ffffff">校舎を作る</text>
    <!-- PC とマス目 -->
    <rect x="100" y="104" width="140" height="94" rx="8" fill="#0b2346" stroke="#4fc3ff" stroke-width="3"/>
    <path d="M150 198 L144 218 L196 218 L190 198" fill="#4fc3ff"/>
    <g stroke="#4fc3ff" stroke-opacity="0.45" stroke-width="1.5">
      <path d="M112 128 H228 M112 150 H228 M112 172 H228 M136 114 V188 M160 114 V188 M184 114 V188 M208 114 V188"/>
    </g>
    <rect x="113" y="151" width="94" height="20" fill="#4fc3ff" fill-opacity="0.35"/>
    <path d="M190 116 C196 122 198 126 196 130 C194 134 186 134 185 129 C184 125 187 123 188 120 C189 123 190 124 191 124 C192 121 190 118 190 116 z" fill="url(#fire)"/>
    <rect x="210" y="174" width="16" height="14" fill="#3ddc84"/>
    <g font-size="17" fill="#d6e8ff">
      <text x="28" y="262">・見取り図を下敷きにマス目を塗る</text>
      <text x="28" y="296">・AI で部屋の配置を下書き</text>
      <text x="28" y="330">・火元・開始地点・集合場所を置く</text>
      <text x="28" y="364">・延焼と正解の避難経路を確かめる</text>
    </g>
    <rect x="40" y="410" width="260" height="56" rx="28" fill="#ffb02e"/>
    <text x="170" y="446" text-anchor="middle" font-size="20" font-weight="700" fill="#0b1730">QR コード 1 枚で配る</text>
  </g>

  <line x1="378" y1="282" x2="424" y2="282" stroke="#ffb02e" stroke-width="6" marker-end="url(#head)"/>

  <!-- STEP 2: 生徒が VR で避難する -->
  <g transform="translate(430,24)">
    <rect width="340" height="500" rx="20" fill="url(#panel)" stroke="#4fc3ff" stroke-width="2"/>
    <text x="170" y="40" text-anchor="middle" font-size="15" font-weight="700" fill="#ffb02e" letter-spacing="1">STEP 2 ・ 生徒（スマホ＋ゴーグル）</text>
    <text x="170" y="78" text-anchor="middle" font-size="27" font-weight="700" fill="#ffffff">VR で避難する</text>
    <!-- ゴーグルと煙 -->
    <path d="M86 124 Q100 112 114 124 T142 124 T170 124 T198 124 T226 124 T254 124" fill="none" stroke="#8fa3bf" stroke-width="4" stroke-linecap="round"/>
    <rect x="100" y="142" width="140" height="66" rx="20" fill="#4fc3ff"/>
    <circle cx="140" cy="175" r="20" fill="#0b2346"/>
    <circle cx="200" cy="175" r="20" fill="#0b2346"/>
    <path d="M160 208 L170 190 L180 208 z" fill="#0b2346"/>
    <path d="M140 165 C146 171 148 175 146 179 C144 184 136 184 134 179 C133 175 136 172 138 169 C139 172 140 173 141 173 C142 170 140 167 140 165 z" fill="url(#fire)"/>
    <path d="M200 165 C206 171 208 175 206 179 C204 184 196 184 194 179 C193 175 196 172 198 169 C199 172 200 173 201 173 C202 170 200 167 200 165 z" fill="url(#fire)"/>
    <g font-size="17" fill="#d6e8ff">
      <text x="28" y="262">・QR を読んでゴーグルを着ける</text>
      <text x="28" y="296">・立つ・足踏み・しゃがむで調整</text>
      <text x="28" y="330">・非常ベルと校内放送で避難開始</text>
      <text x="28" y="364">・足踏みで歩き，煙の中はしゃがむ</text>
    </g>
    <rect x="40" y="410" width="260" height="56" rx="28" fill="none" stroke="#ffb02e" stroke-width="2.5"/>
    <text x="170" y="445" text-anchor="middle" font-size="18" font-weight="700" fill="#ffb02e">火と煙は時間とともに広がる</text>
  </g>

  <line x1="776" y1="282" x2="822" y2="282" stroke="#ffb02e" stroke-width="6" marker-end="url(#head)"/>

  <!-- STEP 3: 結果画面で振り返る -->
  <g transform="translate(828,24)">
    <rect width="340" height="500" rx="20" fill="url(#panel)" stroke="#4fc3ff" stroke-width="2"/>
    <text x="170" y="40" text-anchor="middle" font-size="15" font-weight="700" fill="#ffb02e" letter-spacing="1">STEP 3 ・ 生徒と先生</text>
    <text x="170" y="78" text-anchor="middle" font-size="27" font-weight="700" fill="#ffffff">結果画面で振り返る</text>
    <!-- 経路の地図 -->
    <rect x="110" y="104" width="120" height="110" rx="8" fill="#0b2346" stroke="#4fc3ff" stroke-width="3"/>
    <path d="M126 198 L126 166 L170 166 L170 128 L214 128" fill="none" stroke="#3ddc84" stroke-width="4" stroke-dasharray="8 6" stroke-linecap="round"/>
    <path d="M126 198 L126 182 L196 182 L196 128 L214 128" fill="none" stroke="#4fc3ff" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
    <circle cx="126" cy="198" r="6" fill="#4fc3ff"/>
    <circle cx="214" cy="128" r="7" fill="#3ddc84"/>
    <circle cx="160" cy="182" r="9" fill="#ff5a5a" fill-opacity="0.75"/>
    <g font-size="17" fill="#d6e8ff">
      <text x="28" y="262">・自分の経路と正解の経路</text>
      <text x="28" y="296">・火や煙に近づいた所</text>
      <text x="28" y="330">・煙の中で立っていた所</text>
      <text x="28" y="364">・避難にかかった時間</text>
    </g>
    <rect x="40" y="410" width="260" height="56" rx="28" fill="none" stroke="#ffb02e" stroke-width="2.5"/>
    <text x="170" y="445" text-anchor="middle" font-size="18" font-weight="700" fill="#ffb02e">別の火元でもう一度</text>
  </g>

  <!-- 見守り画面 -->
  <rect x="32" y="544" width="1136" height="56" rx="14" fill="#0b2346" stroke="#4fc3ff" stroke-opacity="0.6" stroke-width="2"/>
  <rect x="56" y="558" width="38" height="26" rx="4" fill="none" stroke="#4fc3ff" stroke-width="3"/>
  <path d="M68 584 L66 592 L84 592 L82 584" fill="#4fc3ff"/>
  <text x="112" y="579" font-size="19" fill="#d6e8ff"><tspan font-weight="700" fill="#ffffff">見守り画面</tspan>: 体験中の生徒の目線と音を先生の PC に映し，プロジェクタでクラス全員と共有できる</text>
</svg>
