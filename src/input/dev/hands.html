<!doctype html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>input/ 手の確認（dev）</title>
    <style>
      body {
        margin: 0;
        padding: 12px;
        background: #000;
        color: #ddd;
        font-family: system-ui, sans-serif;
        font-size: 14px;
      }
      h1 {
        font-size: 16px;
        margin: 0 0 8px;
      }
      h2 {
        font-size: 14px;
        margin: 12px 0 4px;
        color: #9cf;
      }
      button {
        font-size: 16px;
        padding: 10px 16px;
        margin: 0 8px 8px 0;
      }
      pre {
        margin: 0;
        white-space: pre-wrap;
        font-family: ui-monospace, monospace;
        font-size: 13px;
      }
      .home {
        display: inline-block;
        margin-bottom: 8px;
        color: #9cf;
      }
      canvas {
        display: block;
        width: 100%;
        max-width: 640px;
        background: #111;
      }
    </style>
  </head>
  <body>
    <a class="home" href="./?stay">← dev ページの一覧</a>
    <h1>手の確認（担当D の dev ページ）</h1>
    <button id="start" type="button">カメラを開始して記録</button>
    <button id="download" type="button" disabled>記録をダウンロード（.jsonl）</button>
    <h2>カメラの映像と 21 点（線: 認識した点，白い丸: なめらかにした手のひらの中心，黄色: 人差し指の先）</h2>
    <canvas id="view" width="320" height="240"></canvas>
    <h2>認識の状態</h2>
    <pre id="stats">未開始</pre>
    <h2>手（左・右）</h2>
    <pre id="hands">-</pre>
    <h2>記録の状態（2 秒ごとに logs/input/ へ送信）</h2>
    <pre id="recorder">未開始</pre>
    <p>
      URL パラメータ: <code>?worker=0</code> でメインスレッドで認識する．しきい値は
      <code>?cameraHfovDeg=60&amp;oneEuroBeta=2</code> のように渡す（項目名は
      <code>src/input/hand/handParams.ts</code>）
    </p>
    <script type="module" src="./handsPage.ts"></script>
  </body>
</html>
