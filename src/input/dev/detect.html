<!doctype html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>input/ 判定の確認（dev）</title>
    <style>
      body {
        margin: 0;
        padding: 12px;
        background: #000;
        color: #ddd;
        font-family: system-ui, sans-serif;
        font-size: 14px;
      }
      h1 {
        font-size: 16px;
        margin: 0 0 8px;
      }
      h2 {
        font-size: 14px;
        margin: 12px 0 4px;
        color: #9cf;
      }
      button {
        font-size: 16px;
        padding: 10px 16px;
        margin: 0 8px 8px 0;
      }
      pre {
        margin: 0;
        white-space: pre-wrap;
        font-family: ui-monospace, monospace;
        font-size: 13px;
      }
      .home {
        display: inline-block;
        margin-bottom: 8px;
        color: #9cf;
      }
      canvas {
        display: block;
        width: 100%;
        height: 160px;
        margin-bottom: 4px;
      }
      #state {
        font-size: 20px;
        font-weight: bold;
        color: #fff;
      }
      .slider {
        display: grid;
        grid-template-columns: 11em 1fr 3.5em;
        align-items: center;
        gap: 6px;
        margin: 2px 0;
      }
      .slider input {
        width: 100%;
      }
    </style>
  </head>
  <body>
    <a class="home" href="./?stay">← dev ページの一覧</a>
    <h1>判定の確認（担当D の dev ページ）</h1>
    <button id="start" type="button">センサーを許可して開始</button>
    <button id="recenter" type="button">正面リセット</button>
    <button id="reset" type="button">判定を初期化</button>
    <button id="download" type="button" disabled>記録をダウンロード（.jsonl）</button>
    <h2>判定（PlayerInput）</h2>
    <pre id="state">-</pre>
    <h2>足踏み: 上下の加速度・帯域通過後・T_high・T_low（直近 5 秒，±4 m/s²）</h2>
    <canvas id="stepChart"></canvas>
    <h2>速さ（m/s）・Δh × 2（m）・|回転速度| / 100（deg/s）・歩（直近 5 秒，±2）</h2>
    <canvas id="stateChart"></canvas>
    <h2>途中の値</h2>
    <pre id="detail">-</pre>
    <h2>出来事（新しい順）</h2>
    <pre id="events">-</pre>
    <h2>しきい値（URL パラメータでも渡せる．例: ?stepHighStanding=1.5）</h2>
    <div id="sliders"></div>
    <button id="defaults" type="button">既定値に戻す</button>
    <h2>記録の状態（2 秒ごとに logs/input/ へ送信）</h2>
    <pre id="recorder">未開始</pre>
    <script type="module" src="./detectPage.ts"></script>
  </body>
</html>
